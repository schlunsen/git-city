<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Git City — code in motion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%99%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Hallmark palette shared with Gource View: teal-tinted inks, one teal accent,
     orange / blue / purple for data. Mono for chrome + numerals, Grotesk for names. */
  :root {
    --ink: #0e1420;
    --stage: #0b111a;
    --panel: rgba(17, 24, 36, 0.80);
    --panel-solid: #131b28;
    --panel2: #1b2536;
    --line: rgba(110, 135, 175, 0.22);
    --ink-100: #f1f4f9;
    --ink-300: #c2cad8;
    --ink-500: #7f8ca3;
    --accent: #64dedb;
    --accent-dim: #3fb8b5;
    --accent-ink: #082524;
    --orange: #ffa03a;
    --blue: #3abeff;
    --purple: #8c78ff;
    --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--ink); color: var(--ink-100);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #scene { position: fixed; inset: 0; display: block; }
  .tnum { font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent);
  }
  .eyebrow.dim { color: var(--ink-500); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  button, input { font-family: var(--mono); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Loading ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 50;
    background: radial-gradient(ellipse at 50% 40%, #16203a 0%, var(--ink) 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loader-city { display: flex; gap: 4px; align-items: flex-end; height: 48px; }
  .loader-city .b { width: 10px; background: var(--accent); border-radius: 1px; animation: bld 1.2s ease-in-out infinite; }
  .loader-city .b:nth-child(1) { height: 30%; animation-delay: 0s; }
  .loader-city .b:nth-child(2) { height: 70%; animation-delay: 0.15s; }
  .loader-city .b:nth-child(3) { height: 100%; animation-delay: 0.3s; }
  .loader-city .b:nth-child(4) { height: 55%; animation-delay: 0.45s; }
  .loader-city .b:nth-child(5) { height: 85%; animation-delay: 0.6s; }
  .loader-city .b:nth-child(6) { height: 40%; animation-delay: 0.75s; }
  @keyframes bld { 0%,100% { transform: scaleY(0.6); opacity: 0.5; } 50% { transform: scaleY(1); opacity: 1; } }
  #loading h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  #loading h1 span { color: var(--accent); }
  #load-status { min-height: 1.2em; font-family: var(--mono); font-size: 12px; color: var(--ink-500); }

  /* ---------- Top bar ---------- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px;
    background: rgba(14, 20, 32, 0.96); border-bottom: 1px solid var(--line);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  .brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .brand .name { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .name b { color: var(--accent); font-weight: 700; }
  .brand .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-500); }
  #search-form {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 4px 12px;
  }
  #search-form:focus-within { border-color: var(--accent-dim); }
  #search-form .at { color: var(--accent); font-family: var(--mono); font-size: 13px; }
  #search-input { background: none; border: none; outline: none; color: var(--ink-100); font-size: 13px; width: 150px; }
  #search-form button {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 6px;
    padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  #search-form button:hover { filter: brightness(1.08); }
  #examples { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--ink-500); }
  #examples span { margin-right: 4px; }
  #examples a {
    color: var(--ink-100); text-decoration: none; padding: 4px 9px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line);
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  #examples a:hover { color: var(--accent); border-color: var(--accent-dim); background: rgba(100, 222, 219, 0.1); }
  #toolbar { margin-left: auto; display: flex; gap: 4px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; backdrop-filter: blur(14px); }
  .tb {
    background: none; border: none; border-radius: 6px; padding: 7px 10px; cursor: pointer;
    color: var(--ink-300); font-size: 11px; letter-spacing: 0.02em; white-space: nowrap;
    transition: color 0.12s, background 0.12s;
  }
  .tb:hover { color: var(--ink-100); background: rgba(255, 255, 255, 0.04); }
  .tb.on { color: var(--accent); }
  .tb.on::before { content: "● "; font-size: 8px; vertical-align: 2px; }

  /* ---------- Left: profile explorer ---------- */
  #explorer { position: fixed; top: 76px; left: 20px; z-index: 15; width: 250px; pointer-events: none; }
  #explorer > * { pointer-events: auto; }
  #hud-login { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; margin: 6px 0 4px; word-break: break-all; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7), 0 0 14px rgba(0, 0, 0, 0.45); }
  #hud-status { font-family: var(--mono); font-size: 11px; color: var(--ink-300); margin-bottom: 14px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); }
  #profile-head > .eyebrow { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7); color: var(--ink-300); }
  #hud-status .live { color: var(--accent); }
  .kv { padding: 12px 14px; margin-bottom: 10px; }
  .kv .head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .kv .head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .kv .row { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11px; padding: 4px 0; color: var(--ink-500); }
  .kv .row b { color: var(--ink-100); font-weight: 500; }
  .kv .row.repo { cursor: pointer; border-radius: 4px; margin: 0 -6px; padding: 4px 6px; }
  .kv .row.repo:hover { background: rgba(100, 222, 219, 0.08); color: var(--ink-300); }
  .kv .row.repo .nm { display: flex; align-items: center; gap: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv .row.repo .sw { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  /* ---------- Right: timeline clock + activity feed ---------- */
  #clock { position: fixed; top: 76px; right: 20px; z-index: 15; padding: 10px 16px 10px 14px; border-left: 3px solid var(--accent); min-width: 210px; }
  #clock .date { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  #clock .day { font-family: var(--mono); font-size: 26px; font-weight: 600; }
  #clock .mon { font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--accent); }
  #clock .yr { font-family: var(--mono); font-size: 26px; font-weight: 600; margin-left: auto; }
  #clock .sub { font-family: var(--mono); font-size: 10px; color: var(--ink-500); margin-top: 2px; }
  #feed { position: fixed; top: 168px; right: 20px; z-index: 15; width: 250px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .feed-card {
    --c: var(--accent);
    position: relative; overflow: hidden; padding: 10px 14px 10px 18px;
    animation: slidein 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    transition: opacity 0.6s;
  }
  .feed-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); box-shadow: 0 0 12px var(--c); }
  .feed-card .fc-kind { font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--c); }
  .feed-card .fc-repo { font-size: 14px; font-weight: 600; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed-card .fc-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-500); }
  .feed-card .fc-n { position: absolute; right: 12px; top: 8px; font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--c); opacity: 0.35; }
  .feed-card.fading { opacity: 0; }
  @keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- Legend ---------- */
  #legend { position: fixed; bottom: 112px; right: 20px; z-index: 15; padding: 10px 14px; font-family: var(--mono); font-size: 10px; color: var(--ink-500); }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend .swatch { width: 7px; height: 7px; border-radius: 50%; }

  /* ---------- Bottom: transport ---------- */
  #transport {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px 20px 12px;
    background: rgba(14, 20, 32, 0.96); border-top: 1px solid var(--line);
    box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.25);
  }
  #transport .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  #transport .top .range { font-family: var(--mono); font-size: 10px; color: var(--ink-500); }
  #activity { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
  #activity span { flex: 1; min-height: 2px; background: var(--panel2); border-radius: 1px 1px 0 0; transition: background 0.3s; }
  #activity span.played { background: var(--accent-dim); }
  #activity span.now { background: var(--orange); box-shadow: 0 0 8px var(--orange); }
  #transport .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  #play-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink);
    cursor: pointer; font-size: 14px; display: grid; place-items: center; flex: none;
    box-shadow: 0 0 18px rgba(100, 222, 219, 0.4);
  }
  #play-btn:hover { filter: brightness(1.08); }
  #play-btn[disabled] { background: var(--panel2); color: var(--ink-500); box-shadow: none; cursor: default; }
  input[type="range"].timeline {
    -webkit-appearance: none; appearance: none; flex: 1; height: 5px; border-radius: 999px;
    background: linear-gradient(to right, var(--accent) 0 var(--p, 0%), var(--panel2) var(--p, 0%) 100%);
    cursor: pointer;
  }
  input[type="range"].timeline::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--ink); box-shadow: 0 0 0 1px var(--accent);
  }
  input[type="range"].timeline::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--ink); }
  #play-date { font-family: var(--mono); font-size: 11px; color: var(--ink-300); min-width: 84px; text-align: center; }
  .speeds { display: flex; gap: 3px; }
  .sp { background: var(--panel2); border: 1px solid transparent; border-radius: 6px; padding: 5px 9px; color: var(--ink-500); font-size: 11px; cursor: pointer; }
  .sp:hover { color: var(--ink-300); }
  .sp.on { background: rgba(100, 222, 219, 0.14); color: var(--accent); border-color: rgba(100, 222, 219, 0.4); }
  #hint { font-family: var(--mono); font-size: 10px; color: var(--ink-500); white-space: nowrap; }

  /* ---------- Tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 30; pointer-events: none;
    padding: 10px 14px; font-size: 12px; max-width: 280px;
    opacity: 0; transition: opacity 0.12s ease;
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tt-name { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
  #tooltip .tt-desc { color: var(--ink-500); font-size: 11px; margin-bottom: 6px; line-height: 1.4; }
  #tooltip .tt-meta { display: flex; gap: 10px; font-family: var(--mono); font-size: 10px; color: var(--ink-300); }
  #tooltip .tt-lang { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }

  /* ---------- Repo side panel ---------- */
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: 340px; max-width: 85vw;
    background: rgba(17, 24, 36, 0.92); border-left: 1px solid var(--line); backdrop-filter: blur(18px);
    transform: translateX(105%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column; box-shadow: -12px 0 40px rgba(0, 0, 0, 0.4);
  }
  #panel.open { transform: translateX(0); }
  #panel-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; }
  #panel-title { font-size: 18px; font-weight: 700; word-break: break-all; }
  #panel-close { background: none; border: none; color: var(--ink-500); font-size: 20px; cursor: pointer; line-height: 1; padding: 0 2px; }
  #panel-close:hover { color: var(--ink-100); }
  #panel-body { padding: 20px; overflow-y: auto; flex: 1; }
  #panel-desc { color: var(--ink-300); font-size: 12px; line-height: 1.6; margin-bottom: 18px; }
  #panel-desc:empty { display: none; }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .pgrid .cell { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .pgrid .cv { font-family: var(--mono); font-size: 18px; font-weight: 600; }
  .pgrid .cl { font-family: var(--mono); font-size: 9px; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
  #panel-lang { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 18px; }
  #panel-lang .dot { width: 10px; height: 10px; border-radius: 50%; }
  #panel-link { display: block; text-align: center; text-decoration: none; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; padding: 11px; border-radius: 8px; }
  #panel-link:hover { filter: brightness(1.08); }
  #panel-gource { display: block; width: 100%; cursor: pointer; font: inherit; text-align: center; text-decoration: none; margin-top: 8px; padding: 10px; border-radius: 8px;
    font-weight: 600; font-size: 13px; color: var(--purple); border: 1px solid rgba(140, 120, 255, 0.45); background: rgba(140, 120, 255, 0.08); }
  #panel-gource:hover { background: rgba(140, 120, 255, 0.16); }
  #panel-gource-ext { display: block; text-align: center; margin-top: 6px; font-size: 11px; color: var(--ink-500); text-decoration: none; }
  #panel-gource-ext:hover { color: var(--ink-300); }

  /* ---------- Gource View player: an old TV set, in the city's TV-mode style ---------- */
  #gource-modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    background: rgba(6, 10, 18, 0.82); padding: 24px; }
  #gource-modal.open { display: flex; }
  #gource-modal .gm-card { width: min(1180px, 100%); height: min(800px, 100%); display: flex; flex-direction: column; gap: 10px;
    padding: 18px 18px 10px; border-radius: 30px; background: linear-gradient(160deg, #2b3244, #171c28 55%, #10141c);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.09), inset 0 -3px 0 rgba(0, 0, 0, 0.45); }
  #gource-modal .gm-screen { flex: 1; position: relative; border-radius: 24px / 30px; overflow: hidden; background: #04070c;
    box-shadow: 0 0 0 3px #090c13, 0 0 0 5px rgba(255, 255, 255, 0.05); }
  #gource-modal .gm-frame, #gource-modal .gm-crt { position: absolute; inset: 0; border-radius: inherit; }
  #gource-modal iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* CRT glass over the picture: glare, vignette, scanlines, aperture mask, a faint flicker and a slow rolling bar. */
  #gource-modal .gm-crt { pointer-events: none; overflow: hidden;
    background:
      radial-gradient(ellipse at 28% 16%, rgba(255, 255, 255, 0.08), transparent 42%),
      radial-gradient(ellipse at center, transparent 64%, rgba(0, 0, 0, 0.32) 100%), /* subtle vignette */
      repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.24) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(to right, rgba(255, 70, 70, 0.05) 0 1px, rgba(70, 255, 130, 0.04) 1px 2px, rgba(70, 130, 255, 0.05) 2px 3px);
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.4), inset 0 0 8px rgba(0, 0, 0, 0.7);
    animation: gm-flicker 0.12s steps(2) infinite; }
  #gource-modal .gm-crt::after { content: ""; position: absolute; left: 0; right: 0; height: 18%; top: -20%;
    background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.05), transparent); animation: gm-roll 7s linear infinite; }
  /* The chin: power LED, title, a link out and a round knob to switch off. */
  #gource-modal .gm-head { display: flex; align-items: center; gap: 12px; padding: 0 6px; min-height: 28px; font-family: var(--mono); font-size: 12px; }
  #gource-modal .gm-led { width: 8px; height: 8px; border-radius: 50%; background: #ff5a4f; box-shadow: 0 0 8px #ff5a4f; flex: none; }
  #gource-modal .gm-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-300); letter-spacing: 0.04em; }
  #gource-modal .gm-ext { color: var(--purple); text-decoration: none; white-space: nowrap; }
  #gource-modal .gm-close { width: 28px; height: 28px; flex: none; border-radius: 50%; cursor: pointer; line-height: 1; font-size: 15px;
    color: var(--ink-300); border: 1px solid rgba(255, 255, 255, 0.12); background: radial-gradient(circle at 35% 30%, #3b4458, #141923); }
  #gource-modal .gm-close:hover { color: var(--ink-100); }
  @media (max-width: 720px) {
    #gource-modal { padding: 0; }
    #gource-modal .gm-card { border-radius: 0; height: 100%; padding: 10px 10px calc(8px + env(safe-area-inset-bottom)); }
    #gource-modal .gm-close { width: 40px; height: 40px; font-size: 18px; } /* a real tap target */
    #gource-modal .gm-ext { display: none; }
    #gource-modal .gm-loading { font-size: 13px; padding: 10px 12px 10px 16px; }
  }
  /* Loading: the city stays usable; a chip at the clicked building shows progress. */
  #gource-modal.pending { background: transparent; pointer-events: none; }
  #gource-modal.pending .gm-card { opacity: 0; }
  #gource-modal .gm-loading { display: none; position: fixed; left: var(--gx); top: var(--gy); transform: translate(-50%, calc(-100% - 14px));
    align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 999px; pointer-events: auto;
    background: rgba(17, 24, 36, 0.94); border: 1px solid rgba(140, 120, 255, 0.5); font-family: var(--mono); font-size: 12px; color: var(--ink-100);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); animation: gm-pop 0.25s ease-out both; }
  #gource-modal.pending .gm-loading { display: flex; }
  #gource-modal .gm-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(140, 120, 255, 0.3); border-top-color: var(--purple); animation: gm-spin 0.8s linear infinite; }
  #gource-modal .gm-cancel { background: none; border: none; color: var(--ink-500); font-size: 16px; cursor: pointer; line-height: 1; }
  /* Ready: the set swings out of the clicked building, then the tube powers on (dot, line, picture). */
  #gource-modal.reveal { animation: gm-dim 0.4s ease-out both; }
  #gource-modal.reveal .gm-card { transform-origin: var(--ox) var(--oy); animation: gm-set 0.42s cubic-bezier(0.2, 0.9, 0.25, 1.1) both; }
  #gource-modal.reveal .gm-screen > * { animation: gm-on 0.7s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  #gource-modal.reveal .gm-screen > .gm-crt { animation: gm-on 0.7s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both, gm-flicker 0.12s 0.9s steps(2) infinite; }
  /* Closing: the picture collapses to a line, then a dot, and the set fades away. */
  #gource-modal.off { animation: gm-undim 0.36s ease-in both; }
  #gource-modal.off .gm-screen > * { animation: gm-offk 0.32s ease-in both; }
  #gource-modal.off .gm-card { animation: gm-unset 0.36s ease-in both; }
  @keyframes gm-set { from { transform: scale(0.18); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes gm-on {
    0% { transform: scale(0.02, 0.004); filter: brightness(8) saturate(0); }
    30% { transform: scale(1, 0.004); filter: brightness(6) saturate(0); }
    62% { transform: scale(1, 1.03); filter: brightness(1.8) saturate(0.6); }
    100% { transform: none; filter: none; }
  }
  @keyframes gm-offk {
    0% { transform: none; filter: none; }
    55% { transform: scale(1, 0.004); filter: brightness(5); }
    100% { transform: scale(0, 0.004); filter: brightness(8); opacity: 0; }
  }
  @keyframes gm-unset { 0%, 60% { opacity: 1; } 100% { opacity: 0; transform: scale(0.97); } }
  @keyframes gm-dim { from { background: rgba(6, 10, 18, 0); } to { background: rgba(6, 10, 18, 0.82); } }
  @keyframes gm-undim { from { background: rgba(6, 10, 18, 0.82); } to { background: rgba(6, 10, 18, 0); } }
  @keyframes gm-flicker { 50% { opacity: 0.95; } }
  @keyframes gm-roll { to { top: 110%; } }
  @keyframes gm-pop { from { opacity: 0; transform: translate(-50%, calc(-100% - 4px)) scale(0.8); } }
  @keyframes gm-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #gource-modal .gm-crt, #gource-modal .gm-crt::after { animation: none; }
    #gource-modal.reveal .gm-card, #gource-modal.reveal .gm-screen > *, #gource-modal.off .gm-screen > * { animation: none; }
  }
  .panel-section { font-family: var(--mono); font-size: 10px; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.14em; margin: 16px 0 8px; }
  .panel-details { font-family: var(--mono); font-size: 11px; color: var(--ink-300); line-height: 1.8; }

  /* ---------- Error ---------- */
  #error {
    position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); z-index: 45;
    background: rgba(60, 30, 40, 0.9); border: 1px solid rgba(255, 120, 140, 0.35);
    border-radius: 10px; padding: 12px 20px; font-size: 13px; backdrop-filter: blur(12px); display: none; text-align: center;
  }
  #error.show { display: block; }
  #error a { color: #ff9db0; }

  /* ---------- Old-TV mode ---------- */
  /* The 3D view gets a CRT shader; this adds scanlines + vignette over the HUD too. */
  body.tv::after {
    content: ""; position: fixed; inset: 0; z-index: 60; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.09) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 62%, rgba(0, 0, 0, 0.38) 100%);
    animation: tv-flicker 4s steps(60) infinite;
  }
  @keyframes tv-flicker { 0%, 100% { opacity: 0.9; } 50% { opacity: 1; } 51% { opacity: 0.84; } 52% { opacity: 0.95; } }
  #scene.tv-power-on { animation: tv-power-on 0.55s cubic-bezier(0.2, 0.7, 0.2, 1); }
  @keyframes tv-power-on {
    0% { transform: scale(1, 0.004); filter: brightness(4); }
    35% { transform: scale(1, 0.004); filter: brightness(4); }
    70% { transform: scale(1, 1.02); filter: brightness(1.6); }
    100% { transform: none; filter: none; }
  }
  @media (prefers-reduced-motion: reduce) { body.tv::after { animation: none; } #scene.tv-power-on { animation: none; } }

  /* Keep the top bar on one line: shed the tagline, the "try" label and some
     button padding first, then the developer pills. */
  @media (max-width: 1560px) {
    .brand .tag { display: none; }
    #examples > span { display: none; }
    .tb { padding: 7px 8px; }
  }
  @media (max-width: 1340px) { #examples { display: none; } }
  /* ---------- Compact layout: phones, small tablets, landscape phones ----------
     The city is the hero: one-row top bar, everything else tucked into a menu,
     a profile peek card, a one-line clock, a single activity toast, a slim
     transport, and repository details as a bottom sheet. */
  #menu { display: contents; }
  .menu-btn, .profile-toggle { display: none; }
  #scene { touch-action: none; }
  /* The page itself never scrolls or rubber-bands on touch devices: the body is
     pinned, bars refuse page pans, and only the menu / profile / repo sheet
     scroll — inside themselves. */
  html, body { overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
  #topbar, #transport, #clock, #feed, #legend, #loading { touch-action: none; }
  #search-input { touch-action: manipulation; }
  #menu, #explorer, #panel-body { overscroll-behavior: contain; touch-action: pan-y; }
  @media (hover: none) { #tooltip { display: none; } }
  @media (max-width: 900px), (max-height: 500px) {
    #topbar {
      flex-wrap: nowrap; gap: 8px;
      padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
    }
    .brand .tag { display: none; }
    .brand .name { font-size: 16px; }
    #search-form { flex: 1; min-width: 0; max-width: 360px; }
    #search-input { flex: 1; width: auto; min-width: 0; font-size: 16px; } /* 16px: no iOS zoom on focus */
    #search-form button { padding: 8px 12px; }
    .menu-btn {
      display: grid; place-items: center; flex: none; width: 42px; height: 42px; margin-left: auto;
      font-size: 18px; color: var(--ink-100); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    }
    body.menu-open .menu-btn { color: var(--accent); border-color: var(--accent-dim); }

    #menu {
      display: none; position: fixed; z-index: 45;
      top: calc(var(--topbar-h, 58px) + 6px); right: max(10px, env(safe-area-inset-right)); left: max(10px, env(safe-area-inset-left));
      max-width: 420px; margin-left: auto; max-height: calc(100dvh - var(--topbar-h, 58px) - 20px); overflow-y: auto;
      padding: 12px; background: rgba(17, 24, 36, 0.97); border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    body.menu-open #menu { display: block; }
    #menu #examples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    #menu #examples > span {
      display: block; width: 100%; margin: 0 0 2px; font-size: 10px; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-500);
    }
    #menu #examples a { padding: 9px 13px; font-size: 12px; }
    #menu #toolbar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0; padding: 0;
      background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    #menu .tb { min-height: 44px; padding: 8px 4px; font-size: 11px; white-space: normal; background: var(--panel2); border-radius: 8px; }

    #explorer {
      display: block; top: auto; right: auto; left: max(10px, env(safe-area-inset-left));
      bottom: calc(var(--transport-h, 90px) + 8px); width: min(320px, calc(100vw - 20px));
    }
    #profile-head {
      position: relative; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; cursor: pointer;
      padding: 8px 44px 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    #profile-head .eyebrow { display: none; }
    #hud-login { margin: 0; font-size: 17px; text-shadow: none; }
    #hud-status { margin: 0; font-size: 10px; text-shadow: none; }
    .profile-toggle {
      display: grid; place-items: center; position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; background: none; border: 0; color: var(--ink-300); font-size: 13px; cursor: pointer;
      transition: transform 0.2s;
    }
    #explorer.open .profile-toggle { transform: translateY(-50%) rotate(180deg); }
    #explorer .kv { display: none; }
    #explorer.open .kv { display: block; margin: 8px 0 0; }
    #explorer.open { max-height: calc(100dvh - var(--topbar-h, 58px) - var(--transport-h, 90px) - 70px); overflow-y: auto; }
    #explorer .kv .row.repo { padding: 9px 6px; }

    #clock {
      top: calc(var(--topbar-h, 58px) + 8px); left: max(10px, env(safe-area-inset-left)); right: auto;
      min-width: 0; padding: 6px 12px 6px 10px;
    }
    #clock .eyebrow, #clock .sub { display: none; }
    #clock .date { margin: 0; gap: 6px; }
    #clock .day, #clock .mon, #clock .yr { font-size: 15px; }

    #feed {
      display: flex; top: calc(var(--topbar-h, 58px) + 8px); right: max(10px, env(safe-area-inset-right));
      width: min(210px, calc(100vw - 190px));
    }
    .feed-card:not(:first-child) { display: none; }
    .feed-card { padding: 6px 10px 6px 14px; }
    .feed-card .fc-repo { margin: 0; font-size: 12px; }
    .feed-card .fc-meta, .feed-card .fc-n { display: none; }

    #legend, #hint, #transport .top { display: none; }
    #transport {
      padding: 6px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    #activity { height: 16px; }
    #transport .row { gap: 10px; margin-top: 6px; }
    #play-btn { width: 44px; height: 44px; }
    #play-date { min-width: 0; font-size: 10px; }
    .speeds .sp:not(.on) { display: none; }
    .sp { min-width: 44px; min-height: 38px; }

    #panel {
      top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; max-height: 72dvh;
      border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
      transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom);
    }
    #panel.open { transform: none; }
    #panel::before {
      content: ""; position: absolute; top: 7px; left: 50%; width: 40px; height: 4px; margin-left: -20px;
      border-radius: 2px; background: var(--ink-500); opacity: 0.6;
    }
    #panel-head { padding: 20px 16px 12px; }
    #panel-close { width: 44px; height: 44px; margin: -12px -12px 0 0; }
    #panel-body { padding: 14px 16px 18px; }
    #error { bottom: calc(var(--transport-h, 90px) + 64px); width: calc(100% - 24px); }
  }
  /* Landscape phones: every pixel of height counts. */
  @media (max-height: 500px) {
    #activity, #feed { display: none; }
    #transport .row { margin-top: 0; }
    #explorer { width: 250px; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="loading">
  <div class="loader-city">
    <div class="b"></div><div class="b"></div><div class="b"></div>
    <div class="b"></div><div class="b"></div><div class="b"></div>
  </div>
  <h1>Git<span>City</span></h1>
  <p id="load-status">contacting the GitHub API…</p>
</div>

<header id="topbar">
  <div class="brand">
    <span class="name">Git<b>City</b></span>
    <span class="tag">code in motion</span>
  </div>
  <form id="search-form" autocomplete="off">
    <span class="at">@</span>
    <input aria-label="GitHub username" id="search-input" type="text" placeholder="username" spellcheck="false" />
    <button type="submit">Load</button>
  </form>
  <div id="menu">
  <nav id="examples" aria-label="Example profiles">
    <span>try</span>
    <a href="?user=torvalds" data-user="torvalds">torvalds</a>
    <a href="?user=gaearon" data-user="gaearon">gaearon</a>
    <a href="?user=sindresorhus" data-user="sindresorhus">sindresorhus</a>
    <a href="?user=tj" data-user="tj">tj</a>
    <a href="?user=antfu" data-user="antfu">antfu</a>
    <a href="?user=schlunsen" data-user="schlunsen">schlunsen</a>
  </nav>
  <div id="toolbar">
    <button id="reset-btn" class="tb" title="Reset camera">Reset view</button>
    <button id="flyover-btn" class="tb on" title="Slow orbit when idle">Flyover</button>
    <button id="follow-btn" class="tb on" title="Camera drifts toward activity">Follow</button>
    <button id="tour-btn" class="tb" title="Cinematic fly-through (T)">Tour</button>
    <button id="explore-btn" class="tb" type="button" title="Explore: walk, drive or fly (keys 1–4)">Explore</button>
    <button id="daynight-btn" class="tb" title="Auto (local time) / day / night / 60s cycle"><span id="dn-label">Night</span></button>
    <button id="weather-btn" class="tb" title="Weather: clear / rain / snow">Clear</button>
    <button id="fx-btn" class="tb" title="Bloom / grade / grain">FX</button>
    <button id="tv-btn" class="tb" title="Old television look (V)">TV</button>
  </div>
  </div>
  <button id="menu-btn" class="menu-btn" type="button" aria-label="Developers and view options" aria-expanded="false" aria-controls="menu">☰</button>
</header>

<section id="explorer" aria-live="polite">
  <div id="profile-head">
    <div class="eyebrow dim">Profile explorer</div>
    <h1 id="hud-login">—</h1>
    <div id="hud-status">loading…</div>
    <button id="profile-toggle" class="profile-toggle" type="button" aria-label="Show profile details" aria-expanded="false" aria-controls="explorer">▴</button>
  </div>
  <div id="stat-card" class="card kv"></div>
  <div id="top-card" class="card kv"></div>
</section>

<section id="clock" class="card">
  <div class="eyebrow">Timeline</div>
  <div class="date"><span class="day tnum" id="clk-day">—</span><span class="mon" id="clk-mon">—</span><span class="yr tnum" id="clk-year"></span></div>
  <div class="sub" id="clk-sub">no activity loaded</div>
</section>
<div id="feed" aria-live="polite"></div>

<div id="legend" class="card">
  <div class="eyebrow dim" style="margin-bottom:6px">Languages</div>
  <div id="legend-rows"></div>
</div>

<footer id="transport">
  <div class="top">
    <span class="eyebrow dim">Public activity · last 90 days</span>
    <span class="range" id="activity-range"></span>
  </div>
  <div id="activity" aria-hidden="true"></div>
  <div class="row">
    <button id="play-btn" title="Play / pause (space)" aria-label="Play">▶</button>
    <input id="scrub" class="timeline" type="range" min="0" max="1000" value="0" aria-label="Timeline position" />
    <span id="play-date" class="tnum">—</span>
    <div class="speeds" role="group" aria-label="Playback speed">
      <button class="sp" data-speed="0.5">0.5×</button>
      <button class="sp on" data-speed="1">1×</button>
      <button class="sp" data-speed="2">2×</button>
      <button class="sp" data-speed="4">4×</button>
    </div>
    <span id="hint">scroll to zoom · drag to orbit · click a building</span>
  </div>
</footer>

<div id="tooltip" class="card"></div>

<aside id="panel">
  <div id="panel-head">
    <div id="panel-title"></div>
    <button id="panel-close" title="Close">×</button>
  </div>
  <div id="panel-body"></div>
</aside>

<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
